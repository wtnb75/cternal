name: tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: wtnb75/actions/node@v1
      with:
        working-directory: frontend
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: goreleaser release
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: '2.17.0'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Prepare binaries for Docker
      run: |
        mkdir -p linux/amd64 linux/arm64
        cp dist/cternal_linux_amd64_v1/cternal linux/amd64/cternal
        cp dist/cternal_linux_arm64_v8.0/cternal linux/arm64/cternal
    - uses: wtnb75/actions/docker@v1
      with:
        push: 'true'
        context: .
        image-version: ${{ github.ref_name }}
        username: ${{ github.actor }}
        password: ${{ github.token }}
